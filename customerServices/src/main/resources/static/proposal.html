<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Proposal - SecureInsurance</title>
    <link rel="stylesheet" href="../css/proposal.css">
</head>
<body>

<div class="proposal-container">

    <!-- Header -->
    <div class="header">
        <h2>🛡️ Proposal Details</h2>
        <button id="btnHome" class="home-btn">🏠 Home</button>
    </div>

    <!-- Customer & Proposal Section -->
    <div class="section">
        <h3>👤 Customer & Proposal Information</h3>

        <div class="form-group">
            <label>Proposal Number</label>
            <input type="text" id="proposalNumber" placeholder="Enter proposal number">
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" id="mobileNumber" placeholder="Enter mobile number">

            <button id="btnFetchCustomer" class="fetch-btn">Fetch Customer</button>
            <button id="btnFetchProposal" class="fetch-btn fetch-green">Fetch Proposal</button>

            <a href="../register.html" class="register-link">New Customer? Register</a>
        </div>

        <!-- Customer Information -->
        <div id="customerDataSection" class="customer-box" style="display:none;">
            <p><strong>Customer ID:</strong> <span id="customerId"></span></p>
            <p><strong>Name:</strong> <span id="customerName"></span></p>
            <p><strong>Email:</strong> <span id="customerEmail"></span></p>
            <p><strong>Address:</strong> <span id="customerAddress"></span></p>
        </div>
    </div>

    <!-- Policy Section -->
    <div class="section">
        <h3>📄 Policy Information</h3>

        <div class="policy-grid">

            <div class="left-side">
                <div class="form-group">
                    <label>Policy Start Date</label>
                    <input type="date" id="startDate" onchange="updateEndDate()">
                </div>

                <div class="form-group">
                    <label>Policy Tenure (Years)</label>
                    <select id="tenure" onchange="updateEndDate()">
                        <option value="">-- Select Tenure --</option>
                        <option value="1">1 Year</option>
                        <option value="2">2 Years</option>
                        <option value="3">3 Years</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Policy End Date</label>
                    <input type="date" id="endDate" readonly>
                </div>
            </div>

            <div class="right-side">
                <div class="form-group">
                    <label>Department (LOB)</label>
                    <select id="department"></select>
                </div>

                <div class="form-group">
                    <label>Product</label>
                    <select id="product"></select>
                </div>

                <div class="form-group">
                    <label>Remarks</label>
                    <textarea id="remarks"></textarea>
                </div>
            </div>

        </div>
    </div>

    <button id="btnNext" class="submit-btn">Next ➜ Risk Details</button>

</div>

<script src="../js/proposal.js"></script>
</body>
</html>
