<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Insurance - Risk Details</title>
    <link rel="stylesheet" href="../css/p1202.css">
</head>
<body>
<div class="risk-container">
    <header>
        <h2>🚗 Car Insurance - Risk Details</h2>
        <button onclick="goBack()">⬅ Back</button>
    </header>

    <div class="risk-form">
        <div class="form-group">
            <label>Car Registration Number</label>
            <input type="text" id="regNo" placeholder="e.g., TS09CC1234">
        </div>

        <div class="form-group">
            <label>Car Make & Model</label>
            <input type="text" id="model" placeholder="e.g., Maruti Swift VXI">
        </div>

        <div class="form-group">
            <label>Engine Number</label>
            <input type="text" id="engineNo" placeholder="Enter engine number">
        </div>

        <div class="form-group">
            <label>Chassis Number</label>
            <input type="text" id="chassisNo" placeholder="Enter chassis number">
        </div>

        <div class="form-group">
            <label>Manufacture Year</label>
            <input type="number" id="year" placeholder="e.g., 2021">
        </div>

        <button class="submit-btn" onclick="submitRisk1202()">Submit Risk</button>
    </div>
</div>
<script src=".,/js/p1202.js"></script>
</body>
</html>
