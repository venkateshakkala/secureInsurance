<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bike Insurance - Risk Details</title>
    <link rel="stylesheet" href="../css/p1201.css">
</head>
<body>
<div class="risk-container">
    <header>
        <h2>🏍️ Bike Insurance - Risk Details</h2>
        <button onclick="goBack()">⬅ Back</button>
    </header>

    <div class="risk-form">
        <div class="form-group">
            <label>Bike Registration Number</label>
            <input type="text" id="regNo" placeholder="e.g., AP16AB1234">
        </div>

        <div class="form-group">
            <label>Bike Model</label>
            <input type="text" id="model" placeholder="e.g., Hero Splendor">
        </div>

        <div class="form-group">
            <label>Manufacture Year</label>
            <input type="number" id="year" placeholder="e.g., 2020">
        </div>

        <div class="form-group">
            <label>Engine Number</label>
            <input type="text" id="engineNo" placeholder="Enter engine number">
        </div>

        <button class="submit-btn" onclick="submitRisk1201()">Submit Risk</button>
    </div>
</div>
<script src="../js/p1201.js"></script>
</body>
</html>
